{% extends "base.html" %}
{% block title %}Edit profile · WornWorth{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <p class="actions"><button class="btn" type="submit">Save changes</button> <a class="btn btn-ghost" href="{% url 'accounts:profile' %}">Cancel</a></p>
  </form>
</section>
{% endblock %}
